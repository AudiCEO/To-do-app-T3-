<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: .25rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #1a56a0; font-weight: bold; }
    form.card { background: #f2f6fb; padding: 1rem; border-radius: 8px; margin: 1rem 0; }
    input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; margin: .25rem 0 .75rem; font: inherit; }
    button { padding: .5rem 1rem; font: inherit; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .6rem 0; border-bottom: 1px solid #ddd; }
    li .text { flex: 1; }
    li.done .title { text-decoration: line-through; color: #888; }
    .meta { font-size: .85rem; color: #666; }
    .empty { color: #666; }
  </style>
</head>
<body>
  <h1>To-Do List</h1>
  <nav><a href="{% url 'home' %}">Add / View</a><a href="{% url 'search' %}">Search</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
